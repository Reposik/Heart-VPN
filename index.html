<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEART VPN | Redirecting...</title>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
    
    <meta http-equiv="refresh" content="3;url=https://github.com/github_user_on/HeartVPN">

    <style>
        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'Dela Gothic One', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .loader {
            text-align: center;
            animation: pulse 1.5s infinite;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            color: #00ffff;
            font-family: Arial, sans-serif;
            font-size: 0.8rem;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .progress {
            width: 200px;
            height: 2px;
            background: #111;
            margin-top: 20px;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #ff0000;
            animation: load 3s forwards;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.6; transform: scale(0.98); }
        }

        @keyframes load {
            to { width: 100%; }
        }

        a {
            color: #333;
            text-decoration: none;
            font-family: Arial;
            font-size: 10px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="loader">
        <h1>HEART VPN</h1>
        <p>INITIALIZING TERMINAL</p>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
    </div>

    <a href="https://github.com/github_user_on/HeartVPN">Click here if not redirected</a>

    <script>
        // Дополнительный редирект на JS для надежности
        setTimeout(function(){
            window.location.href = "https://github.com/github_user_on/HeartVPN";
        }, 3000);
    </script>
</body>
</html>

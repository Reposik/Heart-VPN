<!DOCTYPE html>
<html lang="ru">

    <style>
        :root {
            --primary: #ff0000;
            --bg: #000000;
            --card-bg: #050505;
            --accent: #00ffff;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Фоновая сетка терминала */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(255, 0, 0, 0.03) 0px, rgba(255, 0, 0, 0.03) 1px, transparent 1px, transparent 2px);
            pointer-events: none;
            z-index: 1;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ С НОВОСТЯМИ */
        .top-nav {
            position: absolute;
            top: 0;
            right: 0;
            padding: 40px;
            z-index: 10;
        }

        .news-header-link {
            font-family: 'Dela Gothic One', cursive;
            color: #222;
            text-decoration: none;
            font-size: 20px;
            letter-spacing: 4px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            border-bottom: 2px solid transparent;
        }

        .news-header-link:hover {
            color: var(--primary);
            text-shadow: 0 0 15px var(--primary);
            letter-spacing: 8px;
            border-bottom: 2px solid var(--primary);
        }

        /* ГЛАВНЫЙ БЛОК */
        .main-frame {
            position: relative;
            z-index: 2;
            text-align: center;
            background: var(--card-bg);
            padding: 80px 100px;
            border: 1px solid #111;
            box-shadow: 0 0 100px rgba(255, 0, 0, 0.1);
            clip-path: polygon(0 5%, 5% 0, 100% 0, 100% 95%, 95% 100%, 0 100%);
        }

        .logo-box {
            margin-bottom: 20px;
            animation: pulse 4s infinite ease-in-out;
        }

        h1 {
            font-family: 'Dela Gothic One', cursive;
            font-size: 65px;
            color: var(--primary);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 1;
        }

        .tagline {
            font-size: 10px;
            letter-spacing: 5px;
            color: #444;
            margin-bottom: 50px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .download-btn {
            display: inline-block;
            padding: 25px 70px;
            background-color: var(--primary);
            color: #fff;
            text-decoration: none;
            font-family: 'Dela Gothic One', cursive;
            font-size: 22px;
            transition: 0.3s;
            border: none;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .download-btn:hover {
            background-color: #fff;
            color: #000;
            box-shadow: 0 0 50px var(--primary);
            transform: scale(1.05);
        }

        @keyframes pulse {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.5)); }
            50% { filter: drop-shadow(0 0 30px rgba(255, 0, 0, 0.8)); }
        }

        .heart-svg {
            width: 120px;
            height: 120px;
        }
        .heart-path {
            fill: none;
            stroke: var(--primary);
            stroke-width: 10;
        }
        .vpn-text {
            fill: var(--accent);
            font-family: 'Dela Gothic One', cursive;
            font-size: 30px;
            text-shadow: 0 0 10px var(--accent);
        }

        .footer-info {
            position: absolute;
            bottom: 30px;
            font-size: 9px;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <nav class="top-nav">

</html>

name: Build Heart VPN EXE

on:
  push:
    branches: [ "main" ] # Сборка запускается при пуше в ветку main

jobs:
  build:
    runs-on: windows-latest # Собираем на серверах Windows

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter requests psutil pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "HeartVPN_Public_Pro" main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HeartVPN-Executable
        path: dist/HeartVPN_Public_Pro.exe
